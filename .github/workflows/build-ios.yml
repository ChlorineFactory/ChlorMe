name: Build ChlorMe iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      llama_release_tag:
        description: "Optional ggml-org/llama.cpp release tag (default b12398 with auto-fallback)"
        required: false
        default: "b12398"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 26+ (for Native iOS 26 Liquid Glass SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_26" ]; then
            echo "Selecting Xcode 26 for native Liquid Glass SDK: $XCODE_26"
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Run ChlorCore Unit Tests
        run: swift test --package-path Packages/ChlorCore

      - name: Download Prebuilt llama.xcframework
        env:
          LLAMA_TAG: ${{ github.event.inputs.llama_release_tag || 'b12398' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-llama-xcframework.sh "$LLAMA_TAG"

      - name: Install XcodeGen & Generate ChlorMe.xcodeproj
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build Unsigned Release iOS App (Auto-Increment Build for LiveContainer Update)
        run: |
          BUILD_NUM=$((10 + ${{ github.run_number }}))
          echo "Building ChlorMe v1.2.0 (Build $BUILD_NUM)..."
          xcodebuild \
            -project ChlorMe.xcodeproj \
            -scheme ChlorMe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="1.2.0" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ChlorMe.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: ChlorMe.app not found at $APP_PATH"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
          rm -rf build/Payload ChlorMe-v1.2.0-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ChlorMe.app
          cd build
          zip -r -y ../ChlorMe-v1.2.0-unsigned.ipa Payload
          cd ..
          ls -lh ChlorMe-v1.2.0-unsigned.ipa

      - name: Upload ChlorMe IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChlorMe-v1.2.0-iOS-IPA
          path: ChlorMe-v1.2.0-unsigned.ipa
          retention-days: 30

name: Build ChlorMe iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      llama_release_tag:
        description: "Optional ggml-org/llama.cpp release tag (default b12398 with auto-fallback)"
        required: false
        default: "b12398"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run ChlorCore Unit Tests
        run: swift test --package-path Packages/ChlorCore

      - name: Download Prebuilt llama.xcframework
        env:
          LLAMA_TAG: ${{ github.event.inputs.llama_release_tag || 'b12398' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-llama-xcframework.sh "$LLAMA_TAG"

      - name: Install XcodeGen & Generate ChlorMe.xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned Release iOS App
        run: |
          xcodebuild \
            -project ChlorMe.xcodeproj \
            -scheme ChlorMe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ChlorMe.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: ChlorMe.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf build/Payload ChlorMe-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ChlorMe.app
          cd build
          zip -r -y ../ChlorMe-unsigned.ipa Payload
          cd ..
          ls -lh ChlorMe-unsigned.ipa

      - name: Upload ChlorMe IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChlorMe-iOS-IPA
          path: ChlorMe-unsigned.ipa
          retention-days: 30

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Cosmic Space Base -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="48%" stop-color="#0A132B"/>
      <stop offset="100%" stop-color="#071B2C"/>
    </linearGradient>

    <!-- Nebula Aurora Glows -->
    <radialGradient id="nebulaCyan" cx="26%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#4DF5DF" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#22A6B3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaViolet" cx="78%" cy="76%" r="58%">
      <stop offset="0%" stop-color="#8A63FF" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#4E2ECF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaRose" cx="76%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#FF7AC6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Outer Orb -->
    <linearGradient id="glassBody" x1="16%" y1="12%" x2="84%" y2="88%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="28%" stop-color="#7CFCEB" stop-opacity="0.16"/>
      <stop offset="68%" stop-color="#8B72FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Prismatic Liquid Glass Rim Stroke -->
    <linearGradient id="prismRim" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="26%" stop-color="#7AFCEB" stop-opacity="0.88"/>
      <stop offset="56%" stop-color="#9A7BFF" stop-opacity="0.72"/>
      <stop offset="82%" stop-color="#FF94D6" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Inner Liquid Speech-Moon Bubble -->
    <linearGradient id="innerOrb" x1="20%" y1="15%" x2="82%" y2="85%">
      <stop offset="0%" stop-color="#B8FFF4" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#4EE8D8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.46"/>
    </linearGradient>

    <!-- Specular Top Glass Arc -->
    <linearGradient id="topSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#D7FFF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Core Starlight Gradient -->
    <radialGradient id="starCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#96FFF0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#5CE1E6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5CE1E6" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="orbitStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84FFEC" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#B49BFF" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="orbClip">
      <circle cx="512" cy="512" r="320"/>
    </clipPath>
  </defs>

  <!-- 1. Solid Cosmic Background -->
  <rect width="1024" height="1024" fill="url(#spaceBg)"/>
  <rect width="1024" height="1024" fill="url(#nebulaCyan)"/>
  <rect width="1024" height="1024" fill="url(#nebulaViolet)"/>
  <rect width="1024" height="1024" fill="url(#nebulaRose)"/>

  <!-- 2. Fine Starfield Dust -->
  <g fill="#FFFFFF">
    <circle cx="152" cy="186" r="3.5" opacity="0.72"/>
    <circle cx="240" cy="128" r="2.2" opacity="0.45"/>
    <circle cx="842" cy="176" r="4.0" opacity="0.80"/>
    <circle cx="894" cy="284" r="2.4" opacity="0.50"/>
    <circle cx="136" cy="768" r="3.2" opacity="0.58"/>
    <circle cx="212" cy="872" r="2.2" opacity="0.42"/>
    <circle cx="846" cy="842" r="3.8" opacity="0.70"/>
    <circle cx="770" cy="134" r="2.0" opacity="0.45"/>
    <circle cx="176" cy="486" r="2.2" opacity="0.38"/>
    <circle cx="888" cy="574" r="2.6" opacity="0.48"/>
  </g>

  <!-- 3. Tilted Cosmic Liquid Orbit Ring (Back Half) -->
  <ellipse cx="512" cy="524" rx="408" ry="138"
           transform="rotate(-24 512 524)"
           fill="none" stroke="url(#orbitStroke)" stroke-width="5" opacity="0.55"/>

  <!-- 4. Ambient Caustic Halo Behind Glass Sphere -->
  <circle cx="486" cy="492" r="286" fill="#4DF5DF" opacity="0.16" filter="url(#heavyGlow)"/>
  <circle cx="556" cy="558" r="250" fill="#8A63FF" opacity="0.22" filter="url(#heavyGlow)"/>

  <!-- 5. Main Liquid Glass Cosmic Sphere -->
  <g>
    <circle cx="512" cy="512" r="320" fill="url(#glassBody)"/>

    <!-- Internal Refracted Caustic Ribbons -->
    <g clip-path="url(#orbClip)">
      <ellipse cx="390" cy="360" rx="220" ry="155" transform="rotate(-22 390 360)" fill="#6FFFE9" opacity="0.22" filter="url(#heavyGlow)"/>
      <ellipse cx="645" cy="670" rx="235" ry="165" transform="rotate(18 645 670)" fill="#9B7CFF" opacity="0.34" filter="url(#heavyGlow)"/>
      <!-- Top Specular Curved Glass Highlight -->
      <ellipse cx="486" cy="272" rx="224" ry="96" transform="rotate(-10 486 272)" fill="url(#topSpecular)"/>
      <!-- Bottom Rim Refraction Bounce -->
      <path d="M 278 688 Q 512 830 746 688" fill="none" stroke="#8CFFE9" stroke-width="18" stroke-linecap="round" opacity="0.26" filter="url(#softGlow)"/>
    </g>

    <!-- Prismatic Double Glass Rim -->
    <circle cx="512" cy="512" r="320" fill="none" stroke="url(#prismRim)" stroke-width="7"/>
    <circle cx="512" cy="512" r="306" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <!-- 6. Central Symbol: Liquid Crescent-C Dialogue Prism (ChlorMe) -->
  <g filter="url(#softGlow)">
    <!-- Soft Glass Companion Bubble with Crescent C Contour -->
    <path d="M 656 414
             A 176 176 0 1 0 656 610
             C 626 640 578 654 532 646
             C 456 632 404 574 404 512
             C 404 434 468 372 546 372
             C 590 372 628 388 656 414 Z"
          fill="url(#innerOrb)" stroke="#D9FFF9" stroke-opacity="0.88" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <!-- Specular Highlight Along Inner Crescent -->
  <path d="M 382 428 A 158 158 0 0 1 564 356"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="8" stroke-linecap="round"/>

  <!-- 7. Radiant Companion Soul Star (4-Point Diamond Star + Satellite Spark) -->
  <circle cx="586" cy="512" r="118" fill="url(#starCoreGlow)"/>
  <g filter="url(#softGlow)">
    <path d="M 586 426
             C 594 484 614 504 672 512
             C 614 520 594 540 586 598
             C 578 540 558 520 500 512
             C 558 504 578 484 586 426 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Secondary Tiny Sparkle (Memory Echo) -->
  <path d="M 692 374
           C 696 396 704 404 726 408
           C 704 412 696 420 692 442
           C 688 420 680 412 658 408
           C 680 404 688 396 692 374 Z"
        fill="#B6FFF4" opacity="0.95"/>

  <!-- Tiny Orbital Droplet Pearl -->
  <circle cx="812" cy="396" r="16" fill="#9AFFE9" filter="url(#softGlow)"/>
  <circle cx="807" cy="391" r="5" fill="#FFFFFF"/>

  <!-- Subtle Outer Lens Ring Detail -->
  <path d="M 206 394 A 334 334 0 0 1 428 190" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4" stroke-linecap="round"/>
</svg>
